name: Deploy React Movie App and Azure Functions to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_AI_KEY: ${{ secrets.VITE_AI_KEY }}
      STORAGE_NAME: ${{ secrets.STORAGE_NAME }}
      CDN_NAME: ${{ secrets.CDN_NAME }}
      CDN_ENDPOINT: ${{ secrets.CDN_ENDPOINT }}
      RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
      FUNCTION_APP_NAME: ${{ secrets.FUNCTION_APP_NAME }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install CI
        run: npm ci        

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Build React App
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Create or update Function App
            az functionapp create \
              --name ${{ secrets.FUNCTION_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
              --consumption-plan-location eastus \
              --runtime node \
              --runtime-version 18 \
              --functions-version 4 \
              --storage-account ${{ secrets.STORAGE_NAME }} || true
            
            # Set TMDB API key as application setting
            az functionapp config appsettings set \
              --name ${{ secrets.FUNCTION_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
              --settings TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"
            
            # Deploy function code
            cd api
            npm install
            cd ..
            az functionapp deployment source config-zip \
              --name ${{ secrets.FUNCTION_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
              --src api.zip || (
                # Create zip and deploy
                cd api && zip -r ../api.zip . && cd ..
                az functionapp deployment source config-zip \
                  --name ${{ secrets.FUNCTION_APP_NAME }} \
                  --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
                  --src api.zip
              )

      - name: Upload to blob storage with Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Set cache headers for different asset types
            
            # Upload static JS/CSS files with long cache (1 year) - these have content hashes
            az storage blob upload-batch \
              --account-name "reactmoviedb" \
              --auth-mode login \
              -d '$web' \
              -s ./dist/assets \
              --destination-path assets \
              --content-cache-control "public, max-age=31536000, immutable" \
              --overwrite
            
            # Upload images with medium cache (30 days)
            az storage blob upload-batch \
              --account-name "reactmoviedb" \
              --auth-mode key \
              -d '$web' \
              -s ./dist/images \
              --destination-path images \
              --overwrite \
              --content-cache-control "public, max-age=2592000" || true
              
            
            # Upload icons and manifest with medium cache (30 days)
            for file in favicon.ico icon-192.png icon-512.png manifest.json; do
              if [ -f "./dist/$file" ]; then
                az storage blob upload \
                  --account-name "reactmoviedb" \
                  --auth-mode key \
                  --container-name '$web' \
                  --name "$file" \
                  --file "./dist/$file" \
                  --content-cache-control "public, max-age=2592000" \
                  --overwrite
              fi
            done
            
            # Upload index.html with no cache (always fetch latest)
            az storage blob upload \
              --account-name "reactmoviedb" \
              --auth-mode key \
              --container-name '$web' \
              --name "index.html" \
              --file "./dist/index.html" \
              --content-cache-control "no-cache, no-store, must-revalidate" \
              --overwrite
            
            # Upload service worker with no cache (if exists)
            if [ -f "./dist/service-worker.js" ]; then
              az storage blob upload \
                --account-name "reactmoviedb" \
                --auth-mode key \
                --container-name '$web' \
                --name "service-worker.js" \
                --file "./dist/service-worker.js" \
                --content-cache-control "no-cache, no-store, must-revalidate" \
                --overwrite
            fi

      - name: Logout from Azure
        if: always()
        run: az logout
